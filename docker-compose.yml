# City Brain — full stack: PostgreSQL + FastAPI backend + nginx-served frontend.
#   cp .env.example .env   (fill in secrets)
#   docker compose up -d --build
#   docker compose exec backend python scripts/seed_data.py   (first run only)
# App is then served at http://localhost:${HTTP_PORT:-8080}

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: citybrain
      POSTGRES_USER: citybrain
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U citybrain -d citybrain"]
      interval: 5s
      timeout: 5s
      retries: 20

  backend:
    build: ./backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      APP_ENV: production
      DEBUG: "false"
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET in .env}
      SECRET_KEY: ${SECRET_KEY:?set SECRET_KEY in .env}
      DATABASE_URL: postgresql+asyncpg://citybrain:${POSTGRES_PASSWORD}@db:5432/citybrain
      DATABASE_URL_SYNC: postgresql://citybrain:${POSTGRES_PASSWORD}@db:5432/citybrain
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:8080}
      CORS_ORIGINS: ${CORS_ORIGINS:-}
      ENABLE_API_DOCS: ${ENABLE_API_DOCS:-false}
      WHATSAPP_ENABLED: "false"
      OPEN_SOURCE_LLM_URL: ${OPEN_SOURCE_LLM_URL:-http://host.docker.internal:11434/api/generate}
      OPEN_SOURCE_LLM_MODEL: ${OPEN_SOURCE_LLM_MODEL:-mistral}
      WHISPER_MODEL_SIZE: ${WHISPER_MODEL_SIZE:-small}
      BHASHINI_API_KEY: ${BHASHINI_API_KEY:-}
      BHASHINI_USER_ID: ${BHASHINI_USER_ID:-}
      SEED_ADMIN_PASSWORD: ${SEED_ADMIN_PASSWORD:-}
      SEED_OFFICER_PASSWORD: ${SEED_OFFICER_PASSWORD:-}
      SEED_DEMO_DATA: ${SEED_DEMO_DATA:-false}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - backend-data:/app/data

  frontend:
    build:
      context: ./frontend
    restart: unless-stopped
    depends_on:
      - backend
    environment:
      BACKEND_URL: http://backend:8000
    ports:
      - "${HTTP_PORT:-8080}:80"

volumes:
  pgdata:
  backend-data:
